services:
  syncdcbot:
    image: ${DOCKERHUB_USERNAME}/syncdcbot:latest
    container_name: syncdcbot
    restart: unless-stopped
    volumes:
      - ./appsettings.json:/app/Configuration/appsettings.json:ro
      - ./logs:/app/logs 
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"