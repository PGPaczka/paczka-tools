# subjects.yaml — katalog przedmiotów (Paczka Organizer)
# =====================================================================
# ZASADA TOŻSAMOŚCI:
#   Skrót przedmiotu NIE jest globalnie unikalny. Tożsamością przedmiotu
#   jest para (semestr, skrot). Gdy ten sam skrót powtarza się w tym samym
#   semestrze — dodatkowo różnicujemy nazwą. Klasyfikator MUSI znać semestr
#   (z docelowej ścieżki paczka/SEM{n}/...), żeby rozstrzygnąć kolizje.
#
# KOLIZJE SKRÓTÓW (ten sam skrót = różne przedmioty):
#   PO  : sem2 Programowanie_Obiektowe    vs  sem7 (KISI) Przetwarzanie_Obrazów
#   SI  : sem4 Sztuczna_Inteligencja      vs  sem7 (KT) Sieci_IP
#   SK  : sem4 Sieci_Komputerowe          vs  sem6 Sieci_Korporacyjne  (por. SK-L sem5)
#   ASK : sem5 Administrowanie_Systemami  vs  sem7 (KT) Administrowanie_Sieciami
#   WFI : sem2, sem3 (Wychowanie Fizyczne I/II — ta sama rodzina, różne instancje)
#
#   Dawne kolizje AK (sem3 vs sem7), PGI (sem5 vs sem6), PDII/SDII (sem6 vs
#   sem7) ZNIKNĘŁY po dopasowaniu skrótów do ground truth w target_repo:
#   sem3 AK -> AKO, sem6 PGI -> PGII, sem7 PDII -> PDIII, sem7 SDII -> SDIII
#   (stare skróty żyją dalej jako aliasy, patrz niżej).
#
#   JAI : sem1..sem5 (Język Angielski I–IV) — ta sama rodzina, różne instancje;
#   jako SKRÓT unikalny tylko w sem2 (JAI); sem3/4/5 to JAII/JAIII/JAIV
#   (alias JAI, zgodnie z ground truth).
#
# forms (formy zajęć, sygnał dla klasyfikatora — jakie kategorie są w ogóle
#   dozwolone dla przedmiotu):
#   W=wykład  C=ćwiczenia  L=laboratoria  P=projekt  S=seminarium
#
# aliases: warianty pisowni spotykane w źródłach (00_SOURCES), w tym stare
#   skróty sprzed dopasowania do ground truth (np. AK -> AKO). Na starcie
#   wypełnione tylko oczywistymi przypadkami; RESZTA DOPISYWANA AUTOMATYCZNIE
#   podczas skanu (fuzzy-match nazw folderów) i zatwierdzana w review.
#
# target_path: paczka/SEM{n}/{SKROT}_{Nazwa}/... (bez nawiasów; Magisterskie_SEM2 = "M2").
#   SEM5 i SEM6 mają dodatkowy poziom STRUMIENIA: paczka/SEM{n}/{strumien}/{SKROT}_{Nazwa}
#   (strumien: Aplikacje | Systemy | Wspolne — przedmioty bez `strumien` w YAML
#   lądują pod Wspolne). SEM7 ma dodatkowy poziom KATEDRY — w repo katalog
#   katedry to `{katedra}_{profil}` (DOKŁADNIE jak w ground truth, np.
#   `KAIMS_Algorytmy_I_Modelowanie_Systemów` — `profil` to klucz pod `profile`
#   w YAML, przepisany 1:1 z nazwy folderu bez prefiksu katedry):
#   paczka/SEM7/{katedra}_{profil}/{SKROT}_{Nazwa} (przedmioty spod klucza
#   `wspolne`, bez profilu, lądują pod samym `Wspolne`). Patrz
#   :attr:`orglib.config.Subject.grupa` / `TARGET_PATH_TEMPLATE_GROUPED`.
# =====================================================================

meta:
  form_codes: { W: wykład, C: ćwiczenia, L: laboratoria, P: projekt, S: seminarium }
  identity_key: "semester + skrot (+ nazwa gdy skrot powtarza się w semestrze)"
  target_path_template: "paczka/SEM{semester}/{skrot}_{nazwa}"                    # SEM1-4
  target_path_template_grouped: "paczka/SEM{semester}/{grupa}/{skrot}_{nazwa}"    # SEM5-7 (grupa=strumień/katedra)
  aliases_note: "aliasy folderów źródłowych dopisywane automatycznie podczas skanu i zatwierdzana w review"

semesters:

  1:
    - { skrot: WAI, nazwa: Wytwarzanie_Aplikacji_Internetowych, forms: [W, P] }
    - { skrot: ME,  nazwa: Matematyka_Elementarna,              forms: [W, C] }
    - { skrot: HiH, nazwa: Hipertekst_i_Hipermedia,             forms: [W, L, P], aliases: [HIH] }
    - { skrot: AM,  nazwa: Analiza_Matematyczna,                forms: [W, C] }
    - { skrot: HDMI, nazwa: Humanistyka_Dla_Inżynierów,         forms: [W], aliases: [HDI] }
    - { skrot: PP,  nazwa: Podstawy_Programowania,              forms: [W, L, P] }
    - { skrot: AL,  nazwa: Algebra_Liniowa,                     forms: [W, C] }

  2:
    - { skrot: PEiM, nazwa: Podstawy_Elektroniki_i_Metrologii,  forms: [W, L], aliases: [PEIM] }
    - { skrot: PF,   nazwa: Podstawy_Fizyki,                    forms: [W, C] }
    - { skrot: JAI,  nazwa: Język_Angielski_I,                  forms: [C], instancja: I }
    - { skrot: SO,   nazwa: Systemy_Operacyjne,                 forms: [W, L] }
    - { skrot: MD,   nazwa: Matematyka_Dyskretna,               forms: [W, C] }
    - { skrot: PO,   nazwa: Programowanie_Obiektowe,            forms: [W, L, P] }   # KOLIZJA z sem7 (Przetwarzanie_Obrazów)
    - { skrot: AiSD, nazwa: Algorytmy_i_Struktury_Danych,       forms: [W, L, P], aliases: [AISD] }
    - { skrot: UC,   nazwa: Układy_Cyfrowe,                     forms: [W, L, P] }
    - { skrot: WFI,  nazwa: Wychowanie_Fizyczne_I,             forms: [C], instancja: I }

  3:
    - { skrot: AKO, nazwa: Architektura_Komputerów, forms: [W, C, L], aliases: [AK, "AKO2020", "AKO2021"] }
    - { skrot: JAII, nazwa: Język_Angielski_II,      forms: [C], instancja: II, aliases: [JAI] }
    - { skrot: JP,  nazwa: Języki_Programowania,    forms: [W, P] }
    - { skrot: BD,  nazwa: Bazy_Danych,             forms: [W, L, P] }
    - { skrot: GK,  nazwa: Grafika_Komputerowa,     forms: [W, L] }
    - { skrot: MII, nazwa: Multimedia_I_Interfejsy, forms: [W, L] }
    - { skrot: PAA, nazwa: Podstawy_Analizy_Algorytmów, forms: [W, C] }
    - { skrot: FW,  nazwa: Fizyka_Współczesna,      forms: [W, L] }
    - { skrot: WFI, nazwa: Wychowanie_Fizyczne_II,  forms: [C], instancja: II }

  4:
    - { skrot: PT,     nazwa: Platformy_Technologiczne,               forms: [W, L] }
    - { skrot: SOMOXII, nazwa: System_Operacyjny_MAC_OS_X_I_IOS,      forms: [W, L] }
    - { skrot: SI,     nazwa: Sztuczna_Inteligencja,                  forms: [W, L, P] }  # KOLIZJA z sem7 (Sieci_IP)
    - { skrot: WDC,    nazwa: Wprowadzenie_Do_Cyberbezpieczeństwa,    forms: [W, P] }
    - { skrot: MN,     nazwa: Metody_Numeryczne,                      forms: [W, L, P] }
    - { skrot: PR,     nazwa: Przetwarzanie_Rozproszone,              forms: [W, L, P] }
    - { skrot: SK,     nazwa: Sieci_Komputerowe,                      forms: [W] }        # KOLIZJA z sem6 (Sieci_Korporacyjne)
    - { skrot: JAIII,  nazwa: Język_Angielski_III,                    forms: [C], instancja: III, aliases: [JAI] }
    - { skrot: SWiM,   nazwa: Systemy_Wbudowane_i_Mikroprocesory,     forms: [W, L], aliases: [SWIM] }
    - { skrot: MPwI,   nazwa: Metody_Probabilistyczne_w_Informatyce,  forms: [W, C, L], aliases: [MPWI] }

  5:
    - { skrot: PGI,  nazwa: PROJEKT_GRUPOWY_I,             forms: [P], instancja: I }
    - { skrot: IO,   nazwa: Inżynieria_Oprogramowania,     forms: [W, L] }
    - { skrot: JAIV, nazwa: Język_Angielski_IV,            forms: [C], instancja: IV, aliases: [JAI] }
    - { skrot: SK-L, nazwa: Sieci_Komputerowe_-_Laboratorium, forms: [L] }
    - { skrot: SAI,  nazwa: Społeczne_Aspekty_Informatyki, forms: [W, P] }
    # --- Strumień: Systemy ---
    - { skrot: SBD, nazwa: Struktury_Baz_Danych,                    forms: [W, P], strumien: Systemy }
    - { skrot: KSS, nazwa: Komputerowe_Systemy_Sterowania,          forms: [W, L], strumien: Systemy }
    - { skrot: SA,  nazwa: Systemy_Agentowe,                        forms: [W, L], strumien: Systemy }
    - { skrot: ASK, nazwa: Administrowanie_Systemami_Komputerowymi, forms: [W, L, P], strumien: Systemy }  # KOLIZJA z sem7 ASK (Sieciami)
    - { skrot: OS,  nazwa: Oprogramowanie_Systemowe,                forms: [W, P], strumien: Systemy }
    - { skrot: KK,  nazwa: Konstrukcja_Kompilatorów,               forms: [W, P], strumien: Systemy }
    # --- Strumień: Aplikacje ---
    - { skrot: BE,  nazwa: Biznes_Elektroniczny,                    forms: [W, P], strumien: Aplikacje }
    - { skrot: WI,  nazwa: Wizualizacja_Informacji,                 forms: [W, P], strumien: Aplikacje }
    - { skrot: ASW, nazwa: Aplikacje_Systemów_Wbudowanych,          forms: [W, L], strumien: Aplikacje }
    - { skrot: HD,  nazwa: Hurtownie_Danych,                        forms: [W, L], strumien: Aplikacje }
    - { skrot: AUI, nazwa: Architektury_Usług_Internetowych,        forms: [W, L], strumien: Aplikacje }
    - { skrot: SIP, nazwa: Systemy_Informacji_Przestrzennej,        forms: [W, L], strumien: Aplikacje }

  6:
    - { skrot: PGII, nazwa: PROJEKT_GRUPOWY_II,                 forms: [P], instancja: II, aliases: [PGI] }
    - { skrot: ZBS,  nazwa: Zarządzanie_Bezpieczeństwem_Sieci,  forms: [W, L] }
    - { skrot: RPI,  nazwa: Realizacja_Projektu_Informatycznego, forms: [W, P] }
    - { skrot: ZFI,  nazwa: Zarządzanie_Firmą_Informatyczną,    forms: [W, P] }
    - { skrot: PDII, nazwa: Projekt_Dyplomowy_Inżynierski_I,    forms: [P], instancja: I }
    - { skrot: SDII, nazwa: Seminarium_Dyplomowe_Inżynierskie_I, forms: [S], instancja: I }
    - { skrot: TRP,  nazwa: Technika_Radia_Programowalnego,     forms: [W, L] }  # forms do potwierdzenia (dodany z ground truth)
    # --- Strumień: Systemy ---
    - { skrot: ZAKO, nazwa: Zaawansowane_Architektury_Komputerów, forms: [W, L], strumien: Systemy, aliases: [ZAK] }
    - { skrot: LSB, nazwa: Lokalne_Sieci_Bezprzewodowe,          forms: [W, L], strumien: Systemy }
    - { skrot: MSO, nazwa: Mobilne_Systemy_Operacyjne,           forms: [W, L], strumien: Systemy }
    - { skrot: ISP, nazwa: Inżynieria_Systemów_Programowalnych,  forms: [W, L], strumien: Systemy }
    - { skrot: ST,  nazwa: Systemy_Telekomunikacyjne,            forms: [W, L], strumien: Systemy }
    - { skrot: SK,  nazwa: Sieci_Korporacyjne,                   forms: [W, P], strumien: Systemy }  # KOLIZJA z sem4 SK (Sieci_Komputerowe)
    # --- Strumień: Aplikacje ---
    - { skrot: KSR, nazwa: Komponentowe_Systemy_Rozproszone,     forms: [W, L], strumien: Aplikacje }
    - { skrot: ED,  nazwa: Eksploracja_Danych,                   forms: [W, L], strumien: Aplikacje }
    - { skrot: WZR, nazwa: Wirtualne_Zespoły_Robocze,            forms: [W, L], strumien: Aplikacje }
    - { skrot: JO,  nazwa: Jakość_Oprogramowania,                forms: [W, P], strumien: Aplikacje }
    - { skrot: BW,  nazwa: Bazy_Wiedzy,                          forms: [W, L], strumien: Aplikacje }
    - { skrot: BSK, nazwa: Bezpieczeństwo_Systemów_Komputerowych, forms: [W, P], strumien: Aplikacje }

  7:
    # Przedmioty wspólne semestru 7 (klucz `wspolne`, bo sem 7 ma obok listy klucz `profile`).
    # Bez `katedra` — w repo lądują pod `SEM7/Wspolne/...` (domyślna grupa, patrz meta powyżej).
    wspolne:
      - { skrot: PDIII, nazwa: Projekt_Dyplomowy_Inżynierski_II, forms: [P], instancja: II, aliases: [PDII] }
      - { skrot: P,     nazwa: Praktyka,                         forms: [] }
      - { skrot: SDIII, nazwa: Seminarium_Dyplomowe_Inżynierskie_II, forms: [S], instancja: II, aliases: [SDII] }
    # Każdy profil niesie `katedra` (jednostka prowadząca) + `przedmioty` (lista
    # jak w innych semestrach). Katalog w repo to `SEM7/{katedra}_{klucz_profilu}/...`
    # — klucz profilu MUSI być przepisany 1:1 z nazwy folderu (bez prefiksu katedry).
    profile:
      Architektura_Systemów_Komputerowych:
        katedra: KASK
        przedmioty:
          - { skrot: PAI,  nazwa: Projektowanie_Aplikacji_Internetowych, forms: [W, P] }
          - { skrot: "SI.", nazwa: Serwisy_Internetowe_.NET,            forms: [W, P] }   # skrót z kropką — zachować dokładnie
          - { skrot: NIAJ, nazwa: Narzędzia_I_Aplikacje_JEE,            forms: [W, L] }
      Inteligentne_Systemy_Interaktywne:
        katedra: KISI
        przedmioty:
          - { skrot: PGK, nazwa: Projektowanie_Gier_Komputerowych, forms: [W, L] }
          - { skrot: PO,  nazwa: Przetwarzanie_Obrazów,            forms: [W, L] }   # KOLIZJA z sem2 PO (Programowanie_Obiektowe)
          - { skrot: DC,  nazwa: Dokumenty_Cyfrowe,                forms: [W, P] }
          - { skrot: AK,  nazwa: Animacja_Komputerowa,             forms: [W, L] }
      Bazy_Danych:
        katedra: KBD
        przedmioty:
          - { skrot: ZSBD, nazwa: Zarządzanie_Systemami_Baz_Danych,  forms: [W, L] }
          - { skrot: NBD,  nazwa: Nierelacyjne_Bazy_Danych,          forms: [W, L] }
          - { skrot: PSSO, nazwa: Projektowanie_Skalowalnych_Systemów_Obiektowych, forms: [W, L, P] }
          - { skrot: ABD,  nazwa: Aplikacje_Baz_Danych,             forms: [W, L] }
      Algorytmy_I_Modelowanie_Systemów:
        katedra: KAIMS
        przedmioty:
          - { skrot: RAI,   nazwa: Realizacja_Aplikacji_Internetowych, forms: [W, L] }
          - { skrot: PLA,   nazwa: Programowanie_Lokalnych_Aplikacji,  forms: [W, P] }
          - { skrot: JPNP,  nazwa: Języki_Programowania_Na_Platformie_NET, forms: [W, L], aliases: ["JPNP."] }  # folder bez kropki przed NET
          - { skrot: WPAIT, nazwa: Wybrane_Problemy_Algorytmiczne_I_Technologiczne, forms: [W, S] }
          - { skrot: ZTO,   nazwa: Zaawansowane_Techniki_Obiektowe,    forms: [W, L] }
      Teleinformatyka:
        katedra: KT
        przedmioty:
          - { skrot: ZS,   nazwa: Zarządzanie_Sieciami,              forms: [W, P] }
          - { skrot: UIAM, nazwa: Usługi_I_Aplikacje_Multimedialne,  forms: [W, P, S] }
          - { skrot: ASK,  nazwa: Administrowanie_Sieciami_Komputerowymi, forms: [W, L] }  # KOLIZJA z sem5 ASK (Systemami)
          - { skrot: SI,   nazwa: Sieci_IP,                          forms: [W, P] }        # KOLIZJA z sem4 SI (Sztuczna_Inteligencja)
      Systemy_Geoinformatyczne:
        katedra: KSG
        przedmioty:
          - { skrot: SNSGIG, nazwa: Systemy_Nawigacji_Satelitarnej_GPS_I_Galileo, forms: [W, L] }
          - { skrot: TWDP,   nazwa: Trójwymiarowa_Wizualizacja_Danych_Przestrzennych, forms: [W, L] }
          - { skrot: PDNPM,  nazwa: Przetwarzanie_Danych_Na_Platformach_Mobilnych, forms: [W, L] }
          - { skrot: PKC,    nazwa: Podstawy_Kartografii_Cyfrowej,   forms: [W, L] }

# Semestry magisterskie (Magisterskie_SEM2 istnieje już w paczce jako osobny katalog).
# Przedmioty magisterskie — DO UZUPEŁNIENIA gdy przejdziemy do materiałów magisterskich.
magisterskie:
  M2: []   # placeholder — uzupełnić listą przedmiotów magisterskich
