# thresholds.yaml — progi decyzyjne (łatwe do strojenia, bez dotykania kodu)

confidence:
  auto_apply: 0.90      # >= : można zatwierdzić automatycznie (po validatorze)
  review_min: 0.70      # [review_min, auto_apply) : do szybkiego review
  # < review_min : unresolved

near_duplicate:
  simhash_hamming_max: 3     # maks. odległość Hamminga simhash uznawana za near-dupe
  minhash_jaccard_min: 0.85  # min. Jaccard (MinHash/LSH) uznawany za near-dupe
  phash_hamming_max: 8       # obrazy: maks. odległość perceptual hash

folder_overlap:
  report_min_ratio: 0.50     # raportuj pary katalogów o pokryciu >= 50%

media:
  threshold_bytes: 26214400  # 25 MiB — powyżej idzie do 90_MEDIA (spójne z syntax.yaml)

llm:
  # Backend AI dla scripts/ai_resolve.py (przez scripts/orglib/llm_client.py). Wybór per zadanie.
  #   anthropic  — API Anthropic (ANTHROPIC_API_KEY; płatne per token)
  #   openai     — API OpenAI (OPENAI_API_KEY; płatne per token)
  #   claude_cli — `claude -p` (limit Claude Pro; Haiku/Sonnet/Opus; Fable = kredyty extra usage)
  #   codex_cli  — `codex exec -s read-only` (limit ChatGPT Plus; zero tokenów Anthropic)
  #   agy_cli    — `agy -p --sandbox` Antigravity CLI = Gemini (Google AI student pack; zero tokenów Anthropic)
  # CLI zewnętrzne zawsze read-only + wymuszony schemat JSON (CLAUDE.md, reguła 9: AI nie dotyka dysku).
  backend: agy_cli           # domyślny backend, gdy zadanie nie ma własnego
  classify:                  # masowe classify_one — tanio, setki wywołań
    backend: agy_cli
    model: gemini-3.8-flash-medium
  relate:                    # relate_cluster / trudne resztki — mocniejszy model, mało wywołań
    backend: claude_cli
    model: sonnet
  max_text_head_bytes: 2048  # ile tekstu na plik wysyłamy do modelu
  timeout_s: 300             # limit na jedno wywołanie CLI/API
  cache: true                # cache decyzji po (sha256, zadanie, hash promptu) w work/ai_cache.sqlite
