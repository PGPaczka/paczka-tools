# thresholds.yaml — progi decyzyjne (łatwe do strojenia, bez dotykania kodu)

confidence:
  auto_apply: 0.90      # >= : można zatwierdzić automatycznie (po validatorze)
  review_min: 0.70      # [review_min, auto_apply) : do szybkiego review
  # < review_min : unresolved

classify:
  # Siła sygnału w klasyfikacji deterministycznej/heurystycznej (scripts/classify.py).
  # Wartości są wprost pewnością (confidence) decyzji, więc czytaj je razem z progami
  # `confidence` wyżej: nazwa pliku i najbliższy katalog wchodzą w auto, sama głowa
  # tekstu i każdy konflikt kategorii idą do review, a poniżej 0.70 pozycja trafia do
  # AI jako `unresolved` — to jest cała bramka kosztowa tego etapu.
  weight_filename: 0.95        # słowo kategorii w NAZWIE pliku
  weight_folder: 0.90          # słowo kategorii w NAJBLIŻSZYM katalogu ze ścieżki
                               # (płytszy katalog liczy się o conflict_penalty słabiej)
  weight_text: 0.74            # słowo kategorii tylko w głowie tekstu (B2)
  conflict_penalty: 0.12       # dwie kategorie z sygnałem tej samej siły
  manifest_review_cap: 0.89    # manifest zgłosił niejasność => nigdy auto-apply
  ground_truth_confidence: 1.0 # treść już leży w paczce (scan_target, run_id=ground_truth)
  media_confidence: 0.99       # rozszerzenie z syntax.yaml: media.extensions
  ignore_confidence: 0.99      # artefakt kompilacji wg syntax.yaml: ignore

near_duplicate:
  simhash_hamming_max: 3     # maks. odległość Hamminga simhash uznawana za near-dupe
  minhash_jaccard_min: 0.85  # min. Jaccard (MinHash/LSH) uznawany za near-dupe
  phash_hamming_max: 8       # obrazy: maks. odległość perceptual hash
  simhash_related_max: 8     # near-miss: podpis poza progiem near-dupe, ale obie treści leżą
                             # w tym samym katalogu źródłowym => relacja `related` (kontekst,
                             # nie duplikat). Sam wspólny katalog, bez podobieństwa, to NIE relacja.
  folder_confirm_bonus: 0.05 # o tyle rośnie pewność pary, którą tłumaczy też wspólny katalog
  phash_text_min_chars: 40   # poniżej tylu znaków OCR nie rozstrzyga niczego o obrazie:
                             # kilkanaście liter to szum. Zmierzone na tej paczce: mediana
                             # krótszego tekstu w odrzuconej parze to 205 znaków, a poniżej
                             # 40 znaków ma tylko 3% odrzuceń — i to te wątpliwe.
  phash_text_hamming_max: 12 # obrazy z OCR: maks. odległość simhasha TEKSTU, przy której
                             # para z phasha zostaje. Luźniej niż `simhash_hamming_max`,
                             # bo OCR dwóch zdjęć tej samej kartki nigdy nie wychodzi
                             # identycznie; para o zgodnych pikselach i rozjechanym
                             # tekście to dwie różne kartki, nie ten sam materiał.
  noise_patterns:            # fnmatch — klastry z pasującą ścieżką pliku pomijane w UI
    - "*.vcxproj*"
    - "*.sln"
    - "*.suo"
    - "*/__pycache__/*"
    - "*/node_modules/*"
    - "*/.git/*"

folder_overlap:
  report_min_ratio: 0.50     # raportuj pary katalogów o pokryciu >= 50%

media:
  threshold_bytes: 26214400  # 25 MiB — powyżej idzie do 90_MEDIA (spójne z syntax.yaml)

llm:
  # Backend AI dla scripts/ai_resolve.py (przez scripts/orglib/llm_client.py). Wybór per zadanie.
  #   anthropic  — API Anthropic (ANTHROPIC_API_KEY; płatne per token)
  #   openai     — API OpenAI (OPENAI_API_KEY; płatne per token)
  #   claude_cli — `claude -p` (limit Claude Pro; Haiku/Sonnet/Opus; Fable = kredyty extra usage)
  #   codex_cli  — `codex exec -s read-only` (limit ChatGPT Plus; zero tokenów Anthropic)
  #   agy_cli    — `agy -p --sandbox` Antigravity CLI = Gemini (Google AI student pack; zero tokenów Anthropic)
  # CLI zewnętrzne zawsze read-only + wymuszony schemat JSON (AGENTS.md: kontrakt klasyfikatora).
  # Jawny override bez edycji YAML:
  #   PACZKA_LLM_CLASSIFY_BACKEND / PACZKA_LLM_CLASSIFY_MODEL
  #   PACZKA_LLM_RELATE_BACKEND  / PACZKA_LLM_RELATE_MODEL
  # Launcher `just codex` ustawia domyślnie RELATE_BACKEND=codex_cli,
  # a `just claude` RELATE_BACKEND=claude_cli.
  # Polityka kosztowa: praca klasyfikacyjna idzie na limit ChatGPT Plus, a Claude/Opus
  # tylko planuje, ocenia wynik i zatwierdza. Żadne zadanie pipeline'u nie zjada
  # domyślnie limitu Anthropic.
  backend: codex_cli         # domyślny backend, gdy zadanie nie ma własnego
  classify:                  # masowe classify_one — tanio, setki wywołań
    backend: codex_cli
    model: gpt-6-astra
  relate:                    # relate_cluster / trudne resztki — mocniejszy model, mało wywołań
    backend: codex_cli
    model: gpt-6-astra
  max_text_head_bytes: 2048  # ile tekstu na plik wysyłamy do modelu
  timeout_s: 300             # limit na jedno wywołanie CLI/API
  cache: true                # cache decyzji po (sha256, zadanie, hash promptu) w work/ai_cache.sqlite
